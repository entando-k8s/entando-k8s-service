
name: B&P

env:
  ENTANDO_GITHUB_TOOLS_VERSION: "v0.1.0"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_PR_TITLE: ${{ github.event.pull_request.title }}
  GH_PR_NUMBER: ${{ github.event.pull_request.number }}
  GH_PR_RUN_NUMBER: ${{ github.run_number }}
  IMAGES_TO_BUILD: "Dockerfile:${{ vars.DOCKER_IMAGE_NAME }}"
  GITHUB_REF: ${{ github.ref }}


on:
  push:
    branches: [ "develop", "release/*" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "develop", "release/*" ]

jobs:
  #~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  build:
    permissions:
      contents: write
      pull-requests: write

    outputs:
      SKIP_SCANS: ${{ steps.configure.outputs.SKIP_SCANS }}
      SKIP_TESTS: ${{ steps.configure.outputs.SKIP_TESTS }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Configure
      id: configure
      run: |
        .github/install-deps.sh
        if [ -f ".github/configure" ]; then . .github/configure "build"; fi
        if [ -n "$FORCE_SKIP_TESTS" ]; then SKIP_TESTS=true; fi
        gh.job.outputVar SKIP_SCANS
        gh.job.outputVar SKIP_TESTS

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Build Java
      run: .github/build.sh

    - name: Submit Dependency Snapshot
      uses: advanced-security/maven-dependency-submission-action@v4

    - name: Save the build output
      uses: actions/upload-artifact@v4
      with:
        name: target
        overwrite: true
        retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 30 }}
        path: |
          target/generated-resources/licenses
          webapp/target/*.war

  #~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  test-and-scan:
    needs: build
    if: ${{ needs.build.outputs.SKIP_TESTS != 'true' }}

    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: ${{ vars.SONAR_ORG }}
      SONAR_URL: ${{ vars.SONAR_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Restore the build output
        uses: actions/download-artifact@v4
        with:
          name: target
          path: .

      - name: Configure
        id: configure
        run: |
          .github/install-deps.sh
          if [ -f ".github/configure" ]; then . .github/configure "test-and-scan"; fi

      - name: Test and Scan
        run: .github/test-and-scan.sh

      - name: Save the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-report
          compression-level: 0
          overwrite: true
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 30 }}
          path: |
            target/site/surefire-report.html
            target/reports/surefire.html

  #~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  publish:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    needs: build

    env:
      DOCKER_ORG: ${{ vars.DOCKER_ORG }}
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_ORG_SNAPSHOT: ${{ vars.DOCKER_ORG_SNAPSHOT }}
      DOCKER_REGISTRY_SNAPSHOT: ${{ vars.DOCKER_REGISTRY_SNAPSHOT }}
      DOCKER_USERNAME_SNAPSHOT: ${{ secrets.DOCKER_USERNAME_SNAPSHOT }}
      DOCKER_PASSWORD_SNAPSHOT: ${{ secrets.DOCKER_PASSWORD_SNAPSHOT }}

    steps:
    - uses: actions/checkout@v4

    - name: Restore the build output
      uses: actions/download-artifact@v4
      with:
        name: target
        path: .

    - name: Configure
      id: configure
      run: |
        .github/install-deps.sh
        if [ -f ".github/configure" ]; then . .github/configure "publish"; fi

    - name: Build Docker image
      run: |
        mkdir -p ./target/generated-resources/licenses
        touch ./target/generated-resources/licenses.xml

        .github/github-tools/docker.multiBuild \
          "${IMAGES_TO_BUILD}" \
          "${ARTIFACT_VERSION}" \
          "${DOCKER_ORG}" \
        ;

    - name: Publish Docker image
      run: |
        GH_DO_COMMENT=true \
          .github/github-tools/docker.multiPublish \
            "${IMAGES_TO_BUILD}" \
            "${ARTIFACT_VERSION}" \
            "${DOCKER_ORG}" \
            "${DOCKER_REGISTRY}" \
            "${DOCKER_USERNAME}" \
            "${DOCKER_PASSWORD}" \
            "${ARTIFACT_PUB_TYPE}" \
          ;
